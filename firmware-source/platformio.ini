[platformio]
default_envs = mooneink_t5_pro_lite

[env:mooneink_t5_pro_lite]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5GFX@0.2.32
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.3
    lewisxhe/SensorLib@0.2.2
build_flags =
    -DBOARD_HAS_PSRAM
    -DPSRAM_SPEED=120MHz
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Wall
    -Wextra
    -Werror=return-type
extra_scripts = pre:scripts/refuse_upload.py

